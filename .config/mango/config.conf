# === vvisual ===
# bloat
# some of these might cause errors if mangowm is compiled
# without scenefx, theconfig still works tho
#blur=0
#blur_layer=0
#shadows = 0
#layer_shadows = 0
animations=0
layer_animations=0
#border_radius=0
focused_opacity=1.0
unfocused_opacity=1.0


# Appearance
gappih=0
gappiv=0
gappoh=0
gappov=0
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=1
rootcolor=0x000000ff
bordercolor=0x1e1e2eff
focuscolor=0xf5c2e7ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# === layout ===
circle_layout=tile,monocle

# Master-Stack Layout Settings
new_is_master=1
default_mfact=0.55
default_nmaster=1

# layout support:
tagrule = id:1, layout_name: tile
tagrule = id:2, layout_name: tile
tagrule = id:3, layout_name: tile
tagrule = id:4, layout_name: tile
tagrule = id:5, layout_name: tile
tagrule = id:6, layout_name: tile
tagrule = id:7, layout_name: tile
tagrule = id:8, layout_name: tile
tagrule = id:9, layout_name: tile

# === misc ===
# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=0
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=0

enable_hotarea=0

# === input ===
# keyboard
repeat_rate=50
repeat_delay=300
numlockon=0
xkb_rules_layout=vmk

# Trackpad
disable_trackpad=0
tap_to_click=0
tap_and_drag=0
drag_lock=0
trackpad_natural_scrolling=0
disable_while_typing=0
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
mouse_natural_scrolling=0


# === binds ===
# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none


bind = SUPER,       p,      spawn,       rofi -show drun
bind = SUPER+ALT,   p,      spawn,       rofi -show run
bind = SUPER,       Return, spawn,       foot
bind = SUPER,       v,      spawn,       firefox
bind = SUPER,       b,      spawn_shell, pidof waybar && killall -SIGUSR1 waybar
bind = SUPER+ALT,   b,      spawn_shell, pidof waybar && killall -SIGUSR2 waybar || waybar &
bind = SUPER+SHIFT, V,      spawn_shell, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = SUPER,       equal,  spawn_shell, rofi -show calc -modi calc -no-show-match -no-sort
bind = SUPER,       o,      spawn,       foot wp -i
bind = SUPER,       n,      spawn,       bmn
bind = SUPER+ALT,   Return, spawn_shell, foot tmux attach -t rr || tmux new -s rr
bind = SUPER,       k,      spawn_shell, kill -9 $(pidof syncthing) && notify-send "SYNCTHING KILLED"
bind = NONE,        Print,  spawn_shell, filename=$HOME/Pictures/grim/$(date +%F_%H-%M-%S).png && slurp | grim -g - $filename && wl-copy -t image/png < $filename
bind = ALT,         Print,  spawn_shell, filename=$HOME/Pictures/grim/$(date +%F_%H-%M-%S).png && grim $filename && wl-copy -t image/png < $filename



bind=SUPER+SHIFT,r,reload_config
bind=SUPER,x,killclient
bind=SUPER+ALT,x,killclient,force

# switch window focus
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,next
bind = SUPER, Tab, zoom

# switch window status
bind=SUPER,space,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,

bind=SUPER,h,resizewin,-50,+0
bind=SUPER,l,resizewin,+50,+0

# switch layout
bind=SUPER,t,switch_layout

# monitors
bind = SUPER,       comma,  focusmon, left
bind = SUPER,       period, focusmon, right
bind = SUPER+SHIFT, comma,  tagmon,   left
bind = SUPER+SHIFT, period, tagmon,   right

# tags
bind = SUPER, 1, view, 1, 0
bind = SUPER, 2, view, 2, 0
bind = SUPER, 3, view, 3, 0
bind = SUPER, 4, view, 4, 0
bind = SUPER, grave, view, 5, 0
bind = SUPER, q, view, 6, 0
bind = SUPER, w, view, 7, 0
bind = SUPER, e, view, 8, 0
bind = SUPER, r, view, 9, 0

bind = SUPER+SHIFT, 1, tagsilent, 1, 0
bind = SUPER+SHIFT, 2, tagsilent, 2, 0
bind = SUPER+SHIFT, 3, tagsilent, 3, 0
bind = SUPER+SHIFT, 4, tagsilent, 4, 0
bind = SUPER+SHIFT, grave, tagsilent, 5, 0
bind = SUPER+SHIFT, q, tagsilent, 6, 0
bind = SUPER+SHIFT, w, tagsilent, 7, 0
bind = SUPER+SHIFT, e, tagsilent, 8, 0
bind = SUPER+SHIFT, r, tagsilent, 9, 0

# plaayerctl
bindl = NONE, XF86AudioPlay,   spawn, playerctl play-pause
bindl = NONE, XF86AudioNext,   spawn, playerctl next
bindl = NONE, XF86AudioPrev,   spawn, playerctl previous

bindl = NONE, XF86HangupPhone, spawn, playerctl play-pause
bindl = NONE, XF86Favorites,   spawn, playerctl next
bindl = NONE, XF86PickupPhone, spawn, playerctl previous

# pactl
bindl = NONE,      XF86AudioRaiseVolume, spawn, pactl set-sink-volume 0 +5%
bindl = NONE,      XF86AudioLowerVolume, spawn, pactl set-sink-volume 0 -5%
bindl = SHIFT,     XF86AudioRaiseVolume, spawn, pactl set-sink-volume 0 +1%
bindl = SHIFT,     XF86AudioLowerVolume, spawn, pactl set-sink-volume 0 -1%
bindl = NONE,      XF86AudioMute,        spawn, pactl set-sink-mute 0 toggle

bind  = ALT,       XF86AudioRaiseVolume, spawn, pactl set-source-volume 0 +5%
bind  = ALT,       XF86AudioLowerVolume, spawn, pactl set-source-volume 0 -5%
bind  = ALT+SHIFT, XF86AudioRaiseVolume, spawn, pactl set-source-volume 0 +1%
bind  = ALT+SHIFT, XF86AudioLowerVolume, spawn, pactl set-source-volume 0 -1%
bindl = NONE,      XF86AudioMicMute,     spawn, pactl set-source-mute 0 toggle

# brightnessctl
bindl = NONE , XF86MonBrightnessUp  , spawn, brightnessctl set 10%+
bindl = NONE , XF86MonBrightnessDown, spawn, brightnessctl set 10%-
bindl = SHIFT, XF86MonBrightnessUp  , spawn, brightnessctl set 1%+
bindl = SHIFT, XF86MonBrightnessDown, spawn, brightnessctl set 1%-

# power adjacent
bind  = SUPER+SHIFT, t, quit
bind  = SUPER, F9,  spawn, swaylock
bindl = SUPER, F10, spawn, suspend
bindl = SUPER, F11, spawn, loginctl reboot
bindl = SUPER, F12, spawn, loginctl poweroff

# mouse buttons
mousebind = SUPER, btn_left,  moveresize, curmove
mousebind = SUPER, btn_right, moveresize, curresize

# submaps (keymodes)
# *used in a way to sort of emulate keychains
keymode=common
bindl = SUPER+ALT+CTRL+SHIFT, Escape, setkeymode, default

keymode=default
bind=SUPER,s,setkeymode,mpd

keymode=mpd
bind = NONE, Escape, setkeymode, default
bind = NONE, space, spawn, mpc toggle
bind = NONE, space, setkeymode, default
bind = NONE, n, spawn, mpc next
bind = NONE, n, setkeymode, default
bind = NONE, j, spawn, mpc next
bind = NONE, j, setkeymode, default
bind = NONE, p, spawn, mpc prev
bind = NONE, p, setkeymode, default
bind = NONE, k, spawn, mpc prev
bind = NONE, k, setkeymode, default
bind = NONE, s, spawn, mpc shuffle
bind = NONE, s, setkeymode, default
bind = NONE, r, spawn, mpc random
bind = NONE, r, setkeymode, default
bind = NONE, l, spawn, mpc repeat
bind = NONE, l, setkeymode, default
bind = NONE, c, spawn, mpc clear
bind = NONE, c, setkeymode, default
bind = NONE, equal, spawn_shell, mpc volume +10 && notify-send -t 300 $(mpc volume)
bind = NONE, equal, setkeymode, default
bind = NONE, minus, spawn_shell, mpc volume -10 && notify-send -t 300 $(mpc volume)
bind = NONE, minus, setkeymode, default
bind = NONE, q, spawn, foot mpq
bind = NONE, q, setkeymode, default
bind = NONE, a, spawn, foot mqa
bind = NONE, a, setkeymode, default
bind = NONE, d, spawn, foot mqd
bind = NONE, d, setkeymode, default
bind = NONE, g, spawn, foot mqg
bind = NONE, g, setkeymode, default


# === monitors ===
# Laptop display: 1080p, 60Hz, no rotation
#monitorrule=eDP-1,0.55,1,tile,0,1,0,0,1920,1080,60
# External monitor: 1680x1050p, 60Hz, positioned to the right
#monitorrule=HDMI-A-1,0.55,1,tile,0,1,1920,0,1680,1050,60

# === rules ===
windowrule=globalkeybinding:super+ctrl-o,appid:obs

# autostart
exec-once = wp
#exec-once = dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=mango
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = syncthing serve --no-browser
exec-once = kdeconnect-indicator
exec-once = pgrep swayidle || swayidle before-sleep swaylock
exec-once = pgrep lowbat || lowbat
exec-once = waybar
exec-once = dunst
#exec-once = fcitx5 -d
